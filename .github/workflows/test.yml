name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale runs when a PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Audit dependencies
        # Advisory until the baseline is clear (continue-on-error): 2026-10-05
        # triage found 16 advisories (see PR body). The fixable set is E1's
        # job; the Next.js critical is owned by E2 (major upgrade, deliberately
        # sequenced after test baselines); @auth/core via next-auth v4 has no
        # patched release in the v4 line and is a documented exception. E1
        # flips this to a hard gate once the baseline is remediated.
        # Full audit (not --omit=dev): devDependencies execute on this VM and
        # in CI, so the baseline covers the whole install.
        # NOTE: npm audit cannot run from the dev VM (registry proxy blocks
        # the audit endpoint); CI is the source of truth for this step.
        continue-on-error: true
        run: npm audit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000)
            [ "$code" = "400" ] && break
            sleep 2
          done

      - name: Create tables
        run: npm run create-tables
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          # DynamoDB Local accepts any non-empty credentials, but they must
          # look like real AWS keys (20-char ID, 40-char secret); the SDK
          # needs something to sign with, and CI runners have no credential
          # chain.
          AUTH_DYNAMODB_ID: AKIAIOSFODNN7EXAMPLE
          AUTH_DYNAMODB_SECRET: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      - name: Unit tests (vitest, 100% coverage thresholds)
        run: npm run test:unit
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          # Note: AUTH_DYNAMODB_ID/SECRET are NOT set here. The adapter
          # regression test (src/lib/auth.test.ts) stubs its own credentials;
          # the dynamodb.test.ts "absent credentials" cases require the vars
          # to be unset.
