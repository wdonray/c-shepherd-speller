name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale runs when a PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: diff
        run: |
          # Docs/CI-only means every changed file matches **.md, LICENSE*,
          # or .github/**. Anything else counts as a code change.
          # Default to running everything when the base ref is unavailable
          # (e.g. workflow_dispatch).
          code="true"
          if [ -n "${{ github.base_ref }}" ]; then
            code="false"
            while IFS= read -r f; do
              case "$f" in
                *.md|LICENSE*|.github/*) ;;
                *)
                  code="true"
                  break
                  ;;
              esac
            done < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Audit dependencies
        # Hard gate via scripts/audit-gate.mjs: fails unless every finding is
        # a documented allowlist entry. npm audit has no ignore-list
        # mechanism, so the script is the gate (see its ALLOWLIST for the
        # documented exceptions and their reasons).
        # Full audit (not --omit=dev): devDependencies execute on this VM and
        # in CI, so the baseline covers the whole install.
        # NOTE: npm audit cannot run from the dev VM (registry proxy blocks
        # the audit endpoint); CI is the source of truth for this step.
        run: node scripts/audit-gate.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000)
            [ "$code" = "400" ] && break
            sleep 2
          done

      - name: Create tables
        run: npm run create-tables
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          # DynamoDB Local accepts any non-empty credentials, but they must
          # look like real AWS keys (20-char ID, 40-char secret); the SDK
          # needs something to sign with, and CI runners have no credential
          # chain.
          AUTH_DYNAMODB_ID: AKIAIOSFODNN7EXAMPLE
          AUTH_DYNAMODB_SECRET: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      - name: Unit tests (vitest, 100% coverage thresholds)
        run: npm run test:unit
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          # Note: AUTH_DYNAMODB_ID/SECRET are NOT set here. The adapter
          # regression test (src/lib/auth.test.ts) stubs its own credentials;
          # the dynamodb.test.ts "absent credentials" cases require the vars
          # to be unset.

  e2e:
    name: E2E tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright chromium
        run: npx playwright install --only-shell chromium

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000)
            [ "$code" = "400" ] && break
            sleep 2
          done

      - name: Create tables
        run: npm run create-tables
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AUTH_DYNAMODB_ID: AKIAIOSFODNN7EXAMPLE
          AUTH_DYNAMODB_SECRET: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AUTH_DYNAMODB_ID: AKIAIOSFODNN7EXAMPLE
          AUTH_DYNAMODB_SECRET: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          NEXTAUTH_SECRET: e2e-ci-secret
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: e2e-dummy
          GOOGLE_CLIENT_SECRET: e2e-dummy

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
