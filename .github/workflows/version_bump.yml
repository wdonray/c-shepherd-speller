name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[RELEASE]') && !contains(github.event.head_commit.message, 'skip-release')"
    steps:
      - uses: actions/checkout@v7
        with:
          # PAT belonging to a ruleset bypass actor, so the version push
          # to main is not blocked by required status checks.
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
          # Full history: the release-tag step diffs the previous release
          # tag against the new tag (git log <prev>...<new>), which fails
          # in a shallow clone once the previous release falls outside the
          # fetch window. (Same reason donray.dev's release-tag workflow
          # uses fetch-depth: 0.)
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check if a release is needed
        id: check
        run: |
          # Docs, legal, and CI-process files never change the app.
          # If every file in this push matches, skip the version bump
          # automatically (same effect as a manual `skip-release`).
          if git diff --name-only HEAD~1 HEAD | grep -qvE '(\.md$|^LICENSE$|^\.github/)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Release-worthy changes detected."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Docs/meta-only push. Skipping release automatically."
          fi

      - name: Determine bump type
        id: bump
        if: steps.check.outputs.needed == 'true'
        run: |
          # Read the subject via git, not via expression interpolation:
          # head_commit.message can be multi-line (squash-merge bodies),
          # which breaks the [[ "..." == feat:* ]] conditional. %s is the
          # first line by construction, so this is always a single line.
          if [[ "$(git log -1 --format=%s)" == feat:* ]]; then
            echo "newversion=minor" >> "$GITHUB_OUTPUT"
          else
            echo "newversion=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.check.outputs.needed == 'true'
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Bump version
        if: steps.check.outputs.needed == 'true'
        run: npm version ${{ steps.bump.outputs.newversion }} -m "[RELEASE] %s"

      - name: Push version commit and tag
        if: steps.check.outputs.needed == 'true'
        run: git push --follow-tags

      # donray.dev creates the GitHub release in a separate tag-triggered
      # workflow, which only fires when the tag is pushed with a PAT.
      # This repo has no PAT secret, and GITHUB_TOKEN pushes never trigger
      # downstream workflows, so the release is created here in the same
      # run instead. The tag already exists remotely after the
      # `git push --follow-tags` step above.
      # The angular preset produces conventional-changelog notes, which the
      # /version page parses for its per-version summaries.
      - name: Get version tag
        id: version
        if: steps.check.outputs.needed == 'true'
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.needed == 'true'
        uses: Akryum/release-tag@a45f9f6a7572682345b87927ea3aacf723225e0b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          preset: angular
